name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Smoke test the CLI
        run: |
          set -euo pipefail
          java -jar build/libs/mcdrift.jar --version
          java -jar build/libs/mcdrift.jar --list-rules

          # Every output format must produce something and not crash. --fail-on never
          # keeps the exit code about the run itself rather than about the findings.
          #
          # Note the subject: mcdrift's own jar is NOT clean, because the rule classes
          # contain the very literals they search for ("world_nether" and friends).
          # Asserting "no findings" here would be asserting the wrong thing.
          for fmt in text summary json sarif github; do
            java -jar build/libs/mcdrift.jar build/libs/mcdrift.jar \
              --format "$fmt" --fail-on never > "/tmp/out.$fmt"
            test -s "/tmp/out.$fmt" || { echo "empty output for $fmt" >&2; exit 1; }
          done

          python3 -c "import json;json.load(open('/tmp/out.sarif'))"
          echo "smoke test passed"

      - name: Verify exit codes
        shell: bash
        run: |
          # The runner's default shell is `bash -e`, which aborts on the first non-zero
          # command — so a bare invocation followed by `[ $? -eq N ]` never reaches the
          # check. Capturing the status inside the assignment keeps -e out of the way.
          set +e

          check() {
            local expected="$1" description="$2"; shift 2
            "$@" >/dev/null 2>&1
            local actual=$?
            if [ "$actual" -ne "$expected" ]; then
              echo "FAIL: $description — expected exit $expected, got $actual" >&2
              return 1
            fi
            echo "ok: $description (exit $actual)"
          }

          failures=0
          check 0 "--fail-on never" \
            java -jar build/libs/mcdrift.jar build/libs/mcdrift.jar --fail-on never || failures=1
          check 2 "a missing file" \
            java -jar build/libs/mcdrift.jar no-such-file.jar || failures=1
          check 2 "an unparseable --target" \
            java -jar build/libs/mcdrift.jar build/libs/mcdrift.jar --target 7.3 || failures=1
          check 2 "an unknown rule in --disable" \
            java -jar build/libs/mcdrift.jar build/libs/mcdrift.jar --disable nope || failures=1
          check 1 "findings with the default --fail-on" \
            java -jar build/libs/mcdrift.jar build/libs/mcdrift.jar || failures=1

          exit $failures

      - name: Check the ruleset is well-formed
        run: |
          python3 - <<'PY'
          import json, sys
          with open("src/main/resources/ruleset.json", encoding="utf-8") as f:
              doc = json.load(f)
          assert doc["schema"] == 1, "unexpected schema version"
          entries = doc["entries"]
          assert len(entries) > 100, f"ruleset looks truncated: {len(entries)} entries"
          for e in entries:
              assert e["owner"] and e["name"], f"incomplete entry: {e}"
              assert e["severity"] in ("ERROR", "WARN", "INFO"), f"bad severity: {e}"
          print(f"ruleset OK: {len(entries)} entries")
          PY

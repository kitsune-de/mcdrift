name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Verify the tag matches the project version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          project=$(grep -oP '^version = "\K[^"]+' build.gradle.kts)
          if [ "$tag" != "$project" ]; then
            echo "tag $tag does not match build.gradle.kts version $project" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/mcdrift.jar \
            src/main/resources/ruleset.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
